const items=document.getElementById('items');
products.forEach((p,i)=>{const box=document.createElement('section');box.className='item';box.innerHTML=`<img alt="${p.name}" src="${p.img}"><div class="details"><div class="name">おうち料理 ${p.name}</div><div class="meta">JAN：${p.jan}<br>規格：${p.weight}　入数：12</div><div class="fields"><label>在庫数（バラ）<input type="number" inputmode="numeric" min="0" max="999" step="1" data-kind="stock" data-i="${i}" placeholder="0"></label><label>発注数（ケース）<input type="number" inputmode="numeric" min="0" max="999" step="1" data-kind="order" data-i="${i}" placeholder="0"></label></div></div>`;items.appendChild(box)});
const read=(kind,i)=>document.querySelector(`[data-kind="${kind}"][data-i="${i}"]`).value;
const valid=v=>v===''||(/^\d+$/.test(v)&&Number(v)<=999);
function update(){let total=0;products.forEach((_,i)=>total+=Number(read('order',i))||0);document.getElementById('total').textContent=total+' ケース'}
items.addEventListener('input',update);
const pad=v=>String(Number(v)||0).padStart(3,'0');
function createText(){const store=document.getElementById('store').value;const date=document.getElementById('date').value.replaceAll('-','');const message=document.getElementById('message');message.textContent='';if(!store||date.length!==8){message.textContent='店舗と発注日を入力してください。';return null}let lines=['店$,発$,在$,商品JANCODE13,発注日000,▼▼▼▼▼▼▼ 商品 ▼▼▼▼▼▼▼,商品群'];for(let i=0;i<products.length;i++){const stock=read('stock',i),order=read('order',i);if(!valid(stock)||!valid(order)){message.textContent='在庫数・発注数は0～999の整数で入力してください。';return null}if(Number(order)>0){const p=products[i];lines.push([store,pad(order),pad(stock),p.jan,date,'おうち料理　'+p.name,'medium'].join(','))}}if(lines.length===1){message.textContent='発注数を1ケース以上入力してください。';return null}return lines.join('\n')}
document.getElementById('preview').onclick=()=>{const t=createText();if(t!==null){document.getElementById('output').value=t;document.getElementById('result').hidden=false}};
document.getElementById('copy').onclick=async()=>{const t=document.getElementById('output').value;try{await navigator.clipboard.writeText(t);alert('コピーしました。LINEに貼り付けてください。')}catch(e){document.getElementById('output').select();alert('テキストを選択しました。コピーしてLINEへ貼り付けてください。')}};
document.getElementById('share').onclick=async()=>{const t=document.getElementById('output').value;if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else{alert('この端末では共有機能が使えません。テキストをコピーしてください。')}};
document.getElementById('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
</script></body></html>
