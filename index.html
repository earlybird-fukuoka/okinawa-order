<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 12px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin: 5px 0 4px 0;
    }

    .sub {
      font-size: 15px;
      margin-bottom: 14px;
    }

    .product {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .jan {
      font-size: 14px;
      color: #555;
      margin-bottom: 3px;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 18px;
      font-weight: bold;
    }

    input {
      width: 65px;
      height: 42px;
      font-size: 22px;
      text-align: center;
      border: 2px solid #777;
      border-radius: 6px;
    }

    .button {
      width: 100%;
      height: 55px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      border: 0;
      border-radius: 8px;
      background: #06c755;
      color: white;
    }
  </style>
</head>

<body>

<h1>沖縄商品発注</h1>
<div class="sub">売場①　　在庫数・発注数を入力してください</div>

<div id="products"></div>

<button class="button" onclick="checkOrder()">発注内容を確認</button>

<script>
const products = [
  ["4962516290015", "オキコ 西表島黒糖 8kg"],
  ["4962516099298", "オキコ グミんちゅ沖縄アセロラ味 40g"],
  ["4962516099441", "オキコ グミんちゅ沖縄マンゴー味 40g"],
  ["4962516099533", "オキコ グミんちゅ沖縄パイン味 40g"],
  ["4962516099540", "オキコ グミんちゅ沖縄シークヮーサー味 40g"],
  ["4962516099762", "オキコ 新シークヮーサーのど飴 70g"],
  ["4962516099090", "オキコ オリエンタルマースカレーナッツ 30g"],
  ["4962516099137", "オキコ 生黒飴シーサーがいっぱい 100g"],
  ["4962516099144", "オキコ おやつ黒糖 150g"],
  ["4983248316248", "斎藤製菓 沖縄限定旨塩プレッツェル 45g"]
];

const area = document.getElementById("products");

products.forEach(function(p, i) {
  const box = document.createElement("div");
  box.className = "product";

  box.innerHTML =
    '<div class="jan">' + p[0] + '</div>' +
    '<div class="name">' + p[1] + '</div>' +
    '<div class="input-row">' +
      '<div class="input-box">在庫' +
        '<input type="number" inputmode="numeric" min="0" id="stock' + i + '">' +
      '</div>' +
      '<div class="input-box">発注' +
        '<input type="number" inputmode="numeric" min="0" id="order' + i + '">' +
      '</div>' +
    '</div>';

  area.appendChild(box);
});

function checkOrder() {
  let message = "【沖縄商品発注・売場①】\n\n";

  products.forEach((p, i) => {
    const stock = document.getElementById("stock" + i).value || "0";
    const order = document.getElementById("order" + i).value || "0";

    message += p[0] + "\n";
    message += p[1] + "\n";
    message += "在庫：" + stock + "　発注：" + order + "\n\n";　
  });

alert("LIFF診断\n準備=" + liffReady + "\nLINE内=" + liff.isInClient() + "\n共有=" + liff.isApiAvailable("shareTargetPicker") + "\nURL=" + location.href);
 if (liffReady && liff.isApiAvailable("shareTargetPicker")) {
  liff.shareTargetPicker([
    {
      type: "text",
      text: message
    }
  ]);
} else {
  alert(message);
}
}
       let liffReady = false;

if (typeof liff !== "undefined") {
  liff.init({ liffId: "2011692014-ts5bFHG2" })
    .then(function() {
      liffReady = true;
      console.log("LIFF初期化成功");
    })
    .catch(function(err) {
      console.error("LIFF初期化エラー", err);
    });
}

</script>

</body>
</html>
